<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="fas fa-book-open me-2"></i>
            Library Management System
        </a>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-light"
               th:href="@{/}">
                <i class="fas fa-home"></i>
                Dashboard
            </a>

            <a class="btn btn-light"
               th:href="@{/books/new}">
                <i class="fas fa-plus"></i>
                Add Book
            </a>

        </div>

    </div>

</nav>

<!-- ================= CONTENT ================= -->

<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <!-- Card Header -->
        <div th:if="${success}"
             class="alert alert-success alert-dismissible fade show"
             role="alert">

            <i class="fas fa-check-circle"></i>

            <span th:text="${success}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>
        <div class="card-header bg-dark text-white">

            <h3 class="mb-0">

                <i class="fas fa-book"></i>

                Library Books

            </h3>

        </div>

        <!-- Card Body -->
        <div class="card-body">

            <!-- Search + Sort -->
            <div class="row mb-4 align-items-center">

                <!-- Search -->
                <div class="col-md-7">

                    <form th:action="@{/books/search}" method="get">

                        <div class="input-group">

                            <input
                                    type="text"
                                    class="form-control"
                                    name="keyword"
                                    placeholder="Search title or author..."
                                    autocomplete="off">

                            <button class="btn btn-primary">

                                <i class="fas fa-search"></i>

                                Search

                            </button>

                        </div>

                    </form>

                </div>

                <!-- Sort -->
                <div class="col-md-5">

                    <form th:action="@{/books/list}" method="get">

                        <input type="hidden" name="page" value="0">

                        <input type="hidden"
                               name="sortDir"
                               th:value="${sortDir}">

                        <div class="input-group">

                    <span class="input-group-text">
                        <i class="fas fa-sort"></i>
                    </span>

                            <select
                                    class="form-select"
                                    name="sortField"
                                    onchange="this.form.submit()">

                                <option value="title"
                                        th:selected="${sortField=='title'}">
                                    Sort by Title
                                </option>

                                <option value="author"
                                        th:selected="${sortField=='author'}">
                                    Sort by Author
                                </option>

                                <option value="category"
                                        th:selected="${sortField=='category'}">
                                    Sort by Category
                                </option>

                                <option value="price"
                                        th:selected="${sortField=='price'}">
                                    Sort by Price
                                </option>

                            </select>

                        </div>

                    </form>

                </div>

            </div>

            <!-- Table -->
            <div class="table-responsive">

                <table class="table table-hover table-bordered align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th class="text-end">Price</th>
                        <th class="text-center">Quantity</th>
                        <th class="text-center">Status</th>
                        <th class="text-center" width="170">Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="book : ${books}">

                        <td th:text="${book.id}"></td>

                        <td th:text="${book.title}"></td>

                        <td th:text="${book.author}"></td>

                        <td th:text="${book.category}"></td>

                        <td class="text-end">

                            ₹ <span th:text="${book.price}"></span>

                        </td>

                        <td class="text-center"
                            th:text="${book.quantity}">
                        </td>

                        <td class="text-center">

                    <span
                            th:if="${book.available}"
                            class="badge rounded-pill bg-success px-3">

                        Available

                    </span>

                            <span
                                    th:unless="${book.available}"
                                    class="badge rounded-pill bg-danger px-3">

                        Unavailable

                    </span>

                        </td>

                        <td class="text-center">

                            <a
                                    th:href="@{/books/edit/{id}(id=${book.id})}"
                                    class="btn btn-warning btn-sm me-1">

                                <i class="fas fa-edit"></i>

                            </a>

                            <a
                                    th:href="@{/books/delete/{id}(id=${book.id})}"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('Delete this book?')">

                                <i class="fas fa-trash"></i>

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- Empty Message -->
            <div
                    th:if="${#lists.isEmpty(books)}"
                    class="alert alert-warning text-center mt-3">

                <i class="fas fa-book-open"></i>

                No books available.

            </div>

            <!-- Footer -->
            <div class="d-flex justify-content-between align-items-center mt-3">

                <small class="text-muted">

                    Total Books :
                    <strong th:text="${totalItems}"></strong>

                </small>

                <small class="text-muted">

                    Page

                    <strong th:text="${currentPage+1}"></strong>

                    of

                    <strong th:text="${totalPages}"></strong>

                </small>

            </div>

            <!-- Pagination -->
            <nav class="mt-3">

                <ul class="pagination justify-content-center">

                    <!-- Previous -->

                    <li class="page-item"
                        th:classappend="${currentPage==0} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/books/list(
                   page=${currentPage-1},
                   sortField=${sortField},
                   sortDir=${sortDir})}">

                            <i class="fas fa-angle-left"></i>

                            Previous

                        </a>

                    </li>

                    <!-- Pages -->

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0,totalPages-1)}"
                        th:classappend="${currentPage==i} ? 'active'">

                        <a class="page-link"
                           th:text="${i+1}"
                           th:href="@{/books/list(
                   page=${i},
                   sortField=${sortField},
                   sortDir=${sortDir})}">
                        </a>

                    </li>

                    <!-- Next -->

                    <li class="page-item"
                        th:classappend="${currentPage==totalPages-1} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/books/list(
                   page=${currentPage+1},
                   sortField=${sortField},
                   sortDir=${sortDir})}">

                            Next

                            <i class="fas fa-angle-right"></i>

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>

    body{
        background:#f8f9fa;
    }

    .navbar-brand{
        font-size:1.4rem;
    }

    .card{
        transition:.3s;
        border-radius:15px;
    }

    .card:hover{
        transform:translateY(-3px);
    }

    .table tbody tr:hover{
        background:#f4f6f9;
    }

    .btn{
        border-radius:8px;
    }

    .badge{
        font-size:.85rem;
    }

</style>

</body>

</html>
